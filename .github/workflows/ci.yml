name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Flutter & Android 质量基线
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: 拉取 Flutter 依赖
        working-directory: flutter_module
        run: flutter pub get

      - name: 静态检查
        working-directory: flutter_module
        run: flutter analyze --no-pub

      - name: 单元测试
        working-directory: flutter_module
        run: flutter test

      - name: 构建 Flutter AAR
        working-directory: flutter_module
        run: flutter build aar

      - name: 编译 Android Debug APK
        run: |
          chmod +x android_app/gradlew
          ./android_app/gradlew -p android_app :app:assembleDebug --no-daemon

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
