plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.qidian.demo'
    compileSdk 36

    defaultConfig {
        applicationId "com.qidian.demo"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 演示工程：release 使用 debug 签名，便于直接安装验证
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

/**
 * 依赖版本与原 APK 对齐（依据：META-INF/*.version 版本标记、okhttp3/internal/Version
 * 中的 userAgent、反编译后的 retrofit2/okhttp3 类结构）：
 *
 * androidx.appcompat            = 1.4.2
 * androidx.core                 = 1.7.0
 * androidx.recyclerview         = 1.2.1
 * androidx.fragment             = 1.4.1
 * androidx.lifecycle            = 2.4.0
 * com.google.android.material   = 1.6.1
 * org.jetbrains.kotlinx.coroutines = 1.6.0
 * okhttp                        = 3.12.6
 * retrofit                      = 2.9.0
 * gson                          = 2.8.9
 *
 * 说明：Flutter 引擎的 AAR 自身会携带更高的 AndroidX 传递依赖，Gradle 会按
 * “最高版本优先”收敛；这里声明的是原项目基线版本，业务代码不依赖更高版本 API。
 */
configurations.all {
    resolutionStrategy {
        // 原包内只有一个 okhttp 版本（3.12.6），retrofit 的传递依赖会把它抬到 3.14.x，
        // 这里强制回原版本，保持网络栈与原项目一致。
        force 'com.squareup.okhttp3:okhttp:3.12.6'
        force 'com.squareup.okhttp3:logging-interceptor:3.12.6'
    }
}

dependencies {
    // ===== Flutter 混合开发模块（flutter build aar 产物，坐标与 Flutter 官方集成说明一致）=====
    debugImplementation "com.qidian.qidian_flutter:flutter_debug:1.0"
    releaseImplementation "com.qidian.qidian_flutter:flutter_release:1.0"

    // ===== AndroidX 基础（版本取自原 APK META-INF/*.version）=====
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.4.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    // ===== 网络请求（对齐原 APK：okhttp 3.12.6 + retrofit 2.9.0 + gson 2.8.9）=====
    implementation 'com.squareup.okhttp3:okhttp:3.12.6'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.12.6'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.8.9'

    // ===== 数据存储（对应原 APK 中的腾讯 MMKV）=====
    implementation 'com.tencent:mmkv:1.3.9'

    // ===== 协程（原包 kotlinx-coroutines 1.6.0）=====
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0'
}
